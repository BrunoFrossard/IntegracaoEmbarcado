<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Editar Registro - Estação IoT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light container py-5">
    <div class="card mx-auto shadow" style="max-width: 500px;">
        <div class="card-body">
            <h4 class="card-title mb-4">Editar Registro #{{ leitura.id }}</h4>
            
            <form id="formEditar">
                <div class="mb-3">
                    <label class="form-label">Temperatura (°C)</label>
                    <input type="number" step="0.1" class="form-control" id="temp" value="{{ leitura.temperatura }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Umidade (%)</label>
                    <input type="number" step="0.1" class="form-control" id="umid" value="{{ leitura.umidade }}" required>
                </div>
                <div class="mb-3">
                    <label class="form-label">Pressão (hPa)</label>
                    <input type="number" step="0.1" class="form-control" id="pres" value="{{ leitura.pressao }}" required>
                </div>
                
                <div class="d-flex justify-content-between mt-4">
                    <a href="/historico" class="btn btn-secondary">Cancelar</a>
                    <button type="submit" class="btn btn-success">Salvar Alterações (PUT)</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        document.getElementById('formEditar').onsubmit = async (e) => {
            e.preventDefault();

            const dados = {
                temperatura: document.getElementById('temp').value,
                umidade: document.getElementById('umid').value,
                pressao: document.getElementById('pres').value
            };

            const res = await fetch(`/leituras/{{ leitura.id }}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(dados)
            });

            if (res.ok) {
                alert("Atualizado com sucesso!");
                window.location.href = '/historico'; 
            } else {
                alert("Erro ao atualizar dados.");
            }
        };
    </script>
</body>
</html>
