<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Estação Meteorológica IoT</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="/">Estação IoT</a>
            <div>
                <a href="/" class="btn btn-outline-light me-2">Painel</a>
                <a href="/historico" class="btn btn-outline-light">Histórico</a>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card text-white bg-danger mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Temperatura Atual</h5>
                        <h2 class="card-text" id="tempAtual">-- °C</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Umidade Atual</h5>
                        <h2 class="card-text" id="umidAtual">-- %</h2>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card text-white bg-success mb-3">
                    <div class="card-body">
                        <h5 class="card-title">Pressão Atual</h5>
                        <h2 class="card-text" id="pressaoAtual">-- hPa</h2>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <h5 class="card-title">Variação Temporal (Tempo Real)</h5>
                <canvas id="graficoVariavel"></canvas>
            </div>
        </div>
    </div>

    <script>
        let meuGrafico;

        async function atualizarDados() {
            try {
                const resposta = await fetch('/api/estatisticas');
                if (!resposta.ok) return;
                const dados = await resposta.json();

                if (dados.historico && dados.historico.length > 0) {
                    const ultimo = dados.historico[dados.historico.length - 1];
                    
                    document.getElementById('tempAtual').innerText = ultimo.temperatura + ' °C';
                    document.getElementById('umidAtual').innerText = ultimo.umidade + ' %';
                    document.getElementById('pressaoAtual').innerText = (ultimo.pressao ? ultimo.pressao : '--') + ' hPa';

                    const labels = dados.historico.map(h => new Date(h.timestamp).toLocaleTimeString());
                    const temps = dados.historico.map(h => h.temperatura);
                    const umids = dados.historico.map(h => h.umidade);

                    if (meuGrafico) {
                        meuGrafico.destroy();
                    }

                    const ctx = document.getElementById('graficoVariavel').getContext('2d');
                    meuGrafico = new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: labels,
                            datasets: [
                                { label: 'Temperatura (°C)', data: temps, borderColor: '#dc3545', tension: 0.3 },
                                { label: 'Umidade (%)', data: umids, borderColor: '#0d6efd', tension: 0.3 }
                            ]
                        }
                    });
                }
            } catch (erro) {
                console.error("Erro ao buscar dados:", erro);
            }
        }

        atualizarDados();
        setInterval(atualizarDados, 5000);
    </script>
</body>
</html>
